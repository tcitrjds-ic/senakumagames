<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>せなくまとマンカラ 🍟</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1d3f35;
        overflow: hidden;
        /* 連打やスワイプでページが動いたり、長押しで選択メニューが出たりしないように */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 中央寄せは Phaser(autoCenter) が行う。ここでも flex で寄せると二重に効いて中央からずれる */
      #game {
        width: 100%;
        height: 100%;
      }
      /* スマホを縦に持っているときだけ出す案内（画面が小さくなるため） */
      #rotate-hint {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 14%;
        margin: 0;
        text-align: center;
        font: 700 15px/1.9 "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
        color: #f3e3c0;
        pointer-events: none;
      }
      @media (orientation: portrait) and (max-width: 640px) {
        #rotate-hint {
          display: block;
        }
      }
      canvas {
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <p id="rotate-hint">📱 よこむきにすると 大きく あそべるよ</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
