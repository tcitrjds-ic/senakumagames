<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>せなくま美術館 🏰</title>
    <style>
      :root {
        --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
        --gold: #e2c064;
        --gold-dark: #8a6420;
        --brown: #4a2a10;
        --cream: #fff6dc;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #1b1a2e; font-family: var(--font); color: var(--cream);
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        touch-action: none; overscroll-behavior: none;
      }
      #app { position: fixed; inset: 0; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

      /* ---- HUD ---- */
      .corner { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); display: flex; flex-direction: column; gap: 8px; z-index: 20; }
      .round {
        width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--gold);
        background: rgba(255, 248, 232, 0.94); color: #7a5a2a; font-size: 21px; line-height: 1;
        display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        touch-action: manipulation;
      }
      .round:active { transform: translateY(2px); }
      #hint {
        position: absolute; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%);
        background: rgba(40, 24, 12, 0.78); border: 2px solid var(--gold); border-radius: 12px;
        padding: 7px 14px; font-size: 14px; font-weight: 700; white-space: nowrap; z-index: 20;
        transition: opacity 0.4s; pointer-events: none; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
      }
      #sign {
        position: absolute; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
        background: #8a5a30; border: 2px solid var(--gold); border-radius: 8px; padding: 5px 12px;
        font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 #4a2c18; z-index: 20; pointer-events: none;
      }
      #toast {
        position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%);
        background: rgba(40, 24, 12, 0.88); border-radius: 10px; padding: 8px 16px; font-size: 16px; font-weight: 700;
        opacity: 0; transition: opacity 0.3s; z-index: 30; pointer-events: none; white-space: nowrap;
      }

      /* ---- 操作 ---- */
      #joy { position: absolute; left: 0; bottom: 0; width: 50%; height: 60%; z-index: 15; touch-action: none; }
      #joy-base {
        position: absolute; width: 130px; height: 130px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.16); border: 3px solid rgba(255, 246, 220, 0.55);
        left: 40px; bottom: 40px; pointer-events: none; transition: opacity 0.2s;
      }
      #joy-knob {
        position: absolute; width: 58px; height: 58px; border-radius: 50%; left: 33px; top: 33px;
        background: radial-gradient(circle at 35% 30%, #fff8e6, #e2c064 70%, #b08a2e);
        box-shadow: 0 4px 10px rgba(0,0,0,0.35);
      }
      #orbit { position: absolute; right: 0; bottom: 0; width: 50%; height: 60%; z-index: 14; touch-action: none; }
      #btns { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(26px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 14px; z-index: 16; }
      .act {
        border: none; border-radius: 50%; font-family: var(--font); font-weight: 800; cursor: pointer;
        color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.35); touch-action: manipulation;
        box-shadow: 0 6px 0 rgba(0,0,0,0.3), inset 0 3px 0 rgba(255,255,255,0.3);
      }
      .act:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.3), inset 0 3px 0 rgba(255,255,255,0.3); }
      #btn-jump { width: 78px; height: 78px; font-size: 30px; background: radial-gradient(circle at 40% 30%, #6fb35a, #3f8a34); }
      #btn-look { width: 92px; height: 92px; font-size: 22px; background: radial-gradient(circle at 40% 30%, #ffd166, #d9922a); color: #4a2a10; text-shadow: none; opacity: 0; transform: scale(0.6); transition: opacity 0.2s, transform 0.2s; pointer-events: none; }
      #btn-look.on { opacity: 1; transform: scale(1); pointer-events: auto; animation: pulse 1.1s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 0 0 0 rgba(255, 220, 120, 0.8); } 50% { box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 0 0 16px rgba(255, 220, 120, 0); } }

      /* ---- ビューア ---- */
      #viewer { position: absolute; inset: 0; z-index: 40; }
      #viewer[hidden] { display: none; }
      #backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0); transition: background 0.5s; }
      #viewer.open #backdrop { background: rgba(0, 0, 0, 0.86); }
      #zoomed {
        position: absolute; left: 50%; top: 50%; transform-origin: center center;
        padding: 18px; background:
          linear-gradient(135deg, #f6dd8a 0%, #c9962e 30%, #f3d573 50%, #b8842a 75%, #f0cf68 100%);
        border-radius: 6px; box-shadow: 0 0 0 4px #7a5416, 0 24px 60px rgba(0,0,0,0.6);
        transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
        will-change: transform;
      }
      #zoomed::before { content: ""; position: absolute; inset: 8px; border: 3px solid #7a5416; border-radius: 3px; pointer-events: none; }
      #zoomed img { display: block; background: #0a0806; box-shadow: inset 0 0 0 4px #2a1a08; }
      #zoomed .canvas { display: block; }
      #band {
        position: absolute; left: 0; right: 0; top: 50%; height: 150px; transform: translateY(-50%) scale(0.6); opacity: 0;
        background: rgba(0, 0, 0, 0.74); border-top: 3px solid var(--gold); border-bottom: 3px solid var(--gold);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s; pointer-events: none;
      }
      #band.on { transform: translateY(-50%) scale(1); opacity: 1; }
      .course { font-size: 20px; font-weight: 800; letter-spacing: 0.08em; }
      .ttl { font-size: clamp(22px, 5vw, 44px); font-weight: 800; text-align: center; padding: 0 60px; line-height: 1.2; }
      .course, .ttl {
        color: #fff3c4;
        text-shadow: -3px -3px 0 var(--brown), 3px -3px 0 var(--brown), -3px 3px 0 var(--brown), 3px 3px 0 var(--brown), 0 6px 0 #000;
      }
      .star { display: inline-block; color: #ffd94a; margin: 0 14px; animation: spin 4s linear infinite; text-shadow: 0 0 6px #ffb000; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #face {
        position: absolute; right: 4%; bottom: -40%; width: min(240px, 42vw); aspect-ratio: 1; border-radius: 50%;
        transition: bottom 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; transform: rotate(-8deg);
      }
      #face.on { bottom: 4%; animation: wiggle 0.32s ease-in-out infinite alternate; }
      @keyframes wiggle { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
      #vhint { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 16px; font-weight: 800; white-space: nowrap; text-shadow: 0 0 4px #000, 0 0 4px #000; animation: blink 1.4s ease-in-out infinite; pointer-events: none; }
      @keyframes blink { 50% { opacity: 0.45; } }
      #close { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 45; }
      .lol { position: absolute; font-weight: 800; color: var(--cream); text-shadow: -2px -2px 0 var(--brown), 2px -2px 0 var(--brown), -2px 2px 0 var(--brown), 2px 2px 0 var(--brown); animation: rise 1.6s ease-out forwards; pointer-events: none; }
      @keyframes rise { from { opacity: 1; transform: translateY(0) rotate(var(--rot)); } to { opacity: 0; transform: translateY(-180px) rotate(var(--rot)); } }
      .shake { animation: shake 0.6s linear; }
      @keyframes shake { 0%, 100% { margin-left: 0; } 10%, 50%, 90% { margin-left: -8px; } 30%, 70% { margin-left: 8px; } }

      /* ---- タイトル（外観） ---- */
      #title { position: absolute; inset: 0; z-index: 60; background: #6aa6e8 url(assets/outside.png) center / cover no-repeat; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: max(34px, env(safe-area-inset-bottom)); transition: opacity 0.6s; }
      #title.off { opacity: 0; pointer-events: none; }
      #title h1 { position: absolute; top: 5vh; margin: 0; font-size: clamp(34px, 7vw, 64px); font-weight: 800; color: #fff3c4; letter-spacing: 0.04em;
        text-shadow: -4px -4px 0 var(--brown), 4px -4px 0 var(--brown), -4px 4px 0 var(--brown), 4px 4px 0 var(--brown), 0 8px 0 #000; }
      #title .sub { position: absolute; top: calc(5vh + clamp(50px, 9vw, 84px)); font-size: clamp(13px, 2.4vw, 18px); font-weight: 800; text-shadow: 0 0 4px #000, 0 0 6px #000; }
      #enter {
        font-family: var(--font); font-size: 24px; font-weight: 800; color: #fff; border: none; border-radius: 999px;
        padding: 16px 48px; background: linear-gradient(180deg, #d9542e, #b83a1c); box-shadow: 0 6px 0 #7a2410, inset 0 2px 0 rgba(255,255,255,0.35);
        cursor: pointer; touch-action: manipulation; min-width: 280px;
      }
      #enter:disabled { filter: grayscale(0.6) brightness(0.85); cursor: wait; }
      #enter:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #7a2410, inset 0 2px 0 rgba(255,255,255,0.35); }
      #title .credit { margin-top: 14px; font-size: 12px; font-weight: 700; text-shadow: 0 0 4px #000, 0 0 6px #000; text-align: center; }
      #title .credit a { color: #fff3c4; }
      #titlechar { position: absolute; left: 50%; bottom: 120px; height: clamp(120px, 28vh, 220px); image-rendering: pixelated; transform: translateX(-120%); animation: bob 1.6s ease-in-out infinite; pointer-events: none; }
      @keyframes bob { 50% { transform: translateX(-120%) translateY(-10px); } }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>

      <div id="sign">1F ホール</div>
      <div id="hint">スティックで あるく ／ 絵に ちかづいて「みる」</div>
      <div class="corner">
        <div class="round" id="btn-mute" title="音">🔊</div>
        <div class="round" id="btn-full" title="全画面">⛶</div>
        <div class="round" id="btn-home" title="ホーム">🏠</div>
      </div>
      <div id="toast"></div>

      <div id="orbit"></div>
      <div id="joy"><div id="joy-base"><div id="joy-knob"></div></div></div>
      <div id="btns">
        <button class="act" id="btn-look">みる</button>
        <button class="act" id="btn-jump">A</button>
      </div>

      <div id="viewer" hidden>
        <div id="backdrop"></div>
        <div id="zoomed"><img id="zimg" alt="" /></div>
        <div id="band"><div class="course" id="course">COURSE 1</div><div class="ttl" id="ttl"></div></div>
        <img id="face" src="assets/face_laugh.png" alt="" />
        <div id="vhint"></div>
        <div class="round" id="close">✕</div>
      </div>

      <div id="title">
        <h1>せなくま美術館</h1>
        <div class="sub">〜 おしろの なかを あるいて 絵を みよう 〜</div>
        <img id="titlechar" src="assets/senakuma_front.png" alt="せなくま" />
        <button id="enter" disabled>よみこみちゅう…</button>
        <div class="credit">非公式のファンメイド作品です。<a href="../">← ゲーム一覧へ</a></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
