# GitHub Pages へのデプロイ
# 有効化手順（初回のみ）: リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
# main へのpushで自動デプロイ。Actionsタブから任意のブランチで手動実行（Run workflow）も可能。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # GitHub Actions は 2026-09-23 に Node 20 を削除する。旧版(checkout@v4 /
      # setup-node@v4 / configure-pages@v5 / deploy-pages@v4)は runs.using が
      # node20 なので、その日を境にデプロイが動かなくなる。
      # 出典: github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      # ※ここの node-version: 22 はビルドに使う Node で、上の話とは別物。
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: サイトを組み立て（/ = ポータル, /runner/, /mancala/）
        run: |
          mkdir -p site/runner site/mancala
          cp -r portal/* site/
          cp -r games/runner-2d/dist/* site/runner/
          cp -r games/mancala/dist/* site/mancala/
      - uses: actions/configure-pages@v6
        with:
          enablement: true # 初回実行時にGitHub Pagesを自動で有効化する
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
